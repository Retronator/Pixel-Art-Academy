<template name="PixelArtAcademy.LearnMode.LoadGame">
  {{#unless deactivated}}
    <div class="pixelartacademy-learnmode-loadgame landsofillusions-components-loadgame landsofillusions-components-savesystem {{editEnabledClass}} {{visibleClass}}">
      {{#if showBackButton}}
        {{> LandsOfIllusions.Components.BackButton args backButtonCallback}}
      {{/if}}
      {{#LandsOfIllusions.Components.Overlay}}
        {{#unless autoLoadedProfileId}}
          <div class="title">
            {{#if editEnabled}}
              Choose a save game to edit
            {{else}}
              Choose a save game to load
            {{/if}}
          </div>
          <ul class="profiles" {{style profilesStyle}}>
            {{#each profiles}}
              <li class="profile {{profileActiveClass}}" data-id="{{_id}}">
                <div class="floppy {{syncedStorageClasses}}">
                  <div class="shutter"></div>
                  <div class="label">{{#if editEnabled}}
                      {{> LandsOfIllusions.Components.LoadGame.SaveGameName}}
                    {{else}}{{debugName}}{{/if}}</div>
                </div>
              </li>
            {{/each}}
          </ul>
          <div class="controls">
            <button class="previous-button action-button {{previousButtonVisibleClass}}" {{previousButtonDisabledAttribute}}>←</button>
            {{#if editEnabled}}
              {{#if editingProfileId}}
                {{#if steam.cloud.enabledForAccount}}
                  {{#if editingProfileHasSteamCloud}}
                    <button class="disable-steam-cloud-button action-button">Disable Steam Cloud</button>
                  {{else}}
                    <button class="enable-steam-cloud-button action-button">Enable Steam Cloud</button>
                  {{/if}}
                {{/if}}
                <button class="remove-button action-button">Remove</button>
              {{/if}}
            {{else}}
              <button class="edit-button action-button {{editButtonVisibleClass}}">Edit</button>
            {{/if}}
            <button class="next-button action-button {{nextButtonVisibleClass}}" {{nextButtonDisabledAttribute}}>→</button>
          </div>
        {{/unless}}
        <div class="progress-overlay {{progressOverlayVisibleClass}}">
          <div class="loading progress {{loadingVisibleClass}}">
            <div class="loading-text progress-text {{loadingTextVisibleClass}}">
              Loading …
              {{#if showProfileLoadingPercentage}}
                {{profileLoadingPercentage}}%
              {{/if}}
            </div>
          </div>
        </div>
      {{/LandsOfIllusions.Components.Overlay}}
    </div>
  {{/unless}}
</template>
