<template name="PixelArtAcademy.Pages.PixelImageClassification">
  <div class="pixelartacademy-pages-pixelimageclassification page">
    <h1>Pixel Art Academy</h1>
    <h2>Pixel Image Classification</h2>

    <div class="controls">
      Upload file: <input class="source-file-input" type="file" accept="image/png"/><br/>
      Width: {{> PixelArtAcademy.Pages.PixelImageClassification.SourceWidth}}
      Height: {{> PixelArtAcademy.Pages.PixelImageClassification.SourceHeight}}<br/>
      <button class="clear-canvas-button">Clear</button>
    </div>
    <div class="main-area">
      <div class="canvas-area">
        <canvas class="source preview-canvas"></canvas>
      </div>
      <div class="input-area">
        <canvas class="splines preview-canvas"></canvas>
      </div>
      <div class="results-area"></div>
    </div>
  </div>
</template>
