<template name="PixelArtAcademy.Pixeltosh.Programs.Chess.Assets.BriefComponent">
  {{#with bitmap}}
    {{> PixelArtAcademy.Practice.Project.Asset.Bitmap.BriefComponent.Properties}}
    {{#if noActions}}
      {{> PixelArtAcademy.Practice.Project.Asset.Bitmap.BriefComponent.NoActions}}
    {{else}}
      <ul class="actions">
        {{> PixelArtAcademy.Practice.Project.Asset.Bitmap.BriefComponent.DefaultActions}}
        {{#if copySourceAsset}}
          <li class="action">
            <button class="button copy-button">Copy {{copySourceAsset.displayName}}</button>
          </li>
        {{/if}}
      </ul>
    {{/if}}
  {{/with}}
</template>
