<template name="PixelArtDatabase.PixelDailies.Pages.Home">
  <div class="pixelartdatabase-pixeldailies-pages-home">
    {{> PixelArtDatabase.PixelDailies.Pages.Home.Header}}
    <div class="intro">
      <div class="page-content">
        <div class="welcome">
          {{#Markdown}}
            Welcome to the Pixel Dailies Archive. This is a fan project made to highlight the
            [Pixel Dailies](https://bsky.app/profile/pixeldailies.bsky.social) community.
            Learn more on the [about page]({{routerPath 'PixelArtDatabase.PixelDailies.Pages.About'}}).

            The archive covers submissions retweeted by the [Pixel Dailies](https://twitter.com/Pixel_Dailies) account
            until mid-2023 when Twitter retired the free API access used to read the account’s timeline.

            While this archive ends here, the community continues to thrive on [Bluesky](https://bsky.app/profile/pixeldailies.bsky.social).

            Choose the year you want to explore in the navigation bar in the top-right.
          {{/Markdown}}
        </div>
      </div>
      {{#with background}}
        <div class="background">
          <img class="image" src="{{url}}"/>
        </div>
        <a class="background-author" href="{{pixelDailiesArtistUrl author year}}">@{{author}}</a>
      {{/with}}
    </div>
  </div>
</template>
