<template name="PixelArtAcademy.Publication.Article.TableOfContents">
  {{#if publication}}
    <ol class="table-of-contents">
    {{#each contentItems}}
      <li class="content-item {{unlockedClass}} {{unreadClass}}">
        <div class="title">
          {{part.title}}
        </div>
      </li>
    {{/each}}
    </ol>
  {{else}}
    Table of Contents
  {{/if}}
</template>
