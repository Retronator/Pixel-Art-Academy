<template name="FataMorgana.Area">
  <div class="fatamorgana-area {{areaClass}} {{value.styleClass}}" {{style areaStyle}}>
    {{#if type}}
      {{> Template.dynamic template=type}}
    {{/if}}
    {{#if contentComponentId}}
      {{> Template.dynamic template=contentComponentId data=componentData}}
    {{/if}}
  </div>
</template>
