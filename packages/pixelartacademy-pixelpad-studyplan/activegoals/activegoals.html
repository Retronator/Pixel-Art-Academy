<template name="PixelArtAcademy.PixelPad.Apps.StudyPlan.ActiveGoals">
  <div class="pixelartacademy-pixelpad-apps-studyplan-activegoals pixelartacademy-pixelpad-apps-studyplan-bottompanel" {{style panelStyle}}>
    <div class="title">
      {{#if opened}}
        <span class="close-hint">x</span>
      {{/if}}
      Active goals
    </div>
    <div class="container" {{style containerStyle}}>
      <div class="content">
        {{#if activeGoals.length}}
          <ol class="sections">
            {{#if shortTermGoals.length}}
              <li class="section">
                <div class="title">Short-term goals</div>
                <p class="explanation">
                  Tasks of short-term goals appear in your to-do list.
                </p>
                <ul class="goals">
                  {{#each shortTermGoals}}
                    <li class="goal">
                      <span class="name">
                        {{> t10e displayNameTranslation}}
                      </span>
                    </li>
                  {{/each}}
                </ul>
              </li>
            {{/if}}
            {{#if midTermGoals.length}}
              <li class="section">
                <div class="title">Mid-term goals</div>
                <p class="explanation">
                  Gain the required interests to be able to work on these goals.
                </p>
                <ul class="goals">
                  {{#each midTermGoals}}
                    <li class="goal">
                      <span class="name">
                        {{> t10e displayNameTranslation}}
                      </span>
                      {{#with requiredInterests}}
                        <span class="required-interests">
                          {{! Note: We have to remove spaces between helpers, otherwise the parentheses will not hug the content. }}
                          ({{#each this
                            }}{{#if @index}} or {{/if
                            }}{{#each this
                              }}{{#if @index}} and {{/if
                              }}{{#with this
                                }}<span class="interest {{interestClass}}">{{> t10e name}}</span>{{/with
                              }}{{/each
                            }}{{/each
                          }})
                        </span>
                      {{/with}}
                    </li>
                  {{/each}}
                </ul>
              </li>
            {{/if}}
            {{#if longTermGoals.length}}
              <li class="section">
                <div class="title">Long-term goals</div>
                <p class="explanation">
                  You're working towards these end game projects.
                </p>
                <ul class="goals">
                  {{#each longTermGoals}}
                    <li class="goal">
                      <span class="name">
                        {{> t10e displayNameTranslation}}
                      </span>
                      {{#with requiredInterestEntries}}
                        <span class="required-interests">({{#each this}}{{#if @index}} or {{/if}}{{#each this}}{{#if @index}} and {{/if}}{{#with this}}<span class="interest {{unavailableInterestClass}}">{{> t10e name}}</span>{{/with}}{{/each}}{{/each}})</span>
                      {{/with}}
                    </li>
                  {{/each}}
                </ul>
              </li>
            {{/if}}
          </ol>
        {{else}}
          <p class="explanation">
            You currently have no active goals. Add new goals or re-enable optional tasks of archived goals.
          </p>
        {{/if}}
      </div>
    </div>
  </div>
</template>
