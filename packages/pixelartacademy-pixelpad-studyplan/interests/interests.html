<template name="PixelArtAcademy.PixelPad.Apps.StudyPlan.Interests">
  <div class="pixelartacademy-pixelpad-apps-studyplan-interests pixelartacademy-pixelpad-apps-studyplan-bottompanel" {{style panelStyle}}>
    <div class="title">
      {{#if opened}}
        <span class="close-hint">x</span>
      {{/if}}
      Interests
    </div>
    <div class="container" {{style containerStyle}}>
      <div class="content">
        <p class="explanation">
          Interests are subjects and skills you gain on your learning journey.
        </p>
        <ul class="sections">
          <li class="section">
            <div class="title">Gained interests</div>
            <ul class="interests">
              {{#each currentInterests}}
                <li class="acquired interest">
                  <span class="name">
                    {{> t10e name}}
                  </span>
                </li>
              {{/each}}
            </ul>
          </li>
          {{#if plannedInterests.length}}
            <li class="section">
              <div class="title">Planned interests</div>
              <ul class="interests">
                {{#each plannedInterests}}
                  <li class="interest">
                    <span class="name">
                      {{> t10e name}}
                    </span>
                  </li>
                {{/each}}
              </ul>
            </li>
          {{/if}}
        </ul>
      </div>
    </div>
  </div>
</template>
