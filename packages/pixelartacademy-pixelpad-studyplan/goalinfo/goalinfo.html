<template name="PixelArtAcademy.PixelPad.Apps.StudyPlan.GoalInfo">
  <div class="pixelartacademy-pixelpad-apps-studyplan-goalinfo {{visibleClass}} {{goalCompletedClass}}">
    <button class="close-button">✕</button>
    <div class="name">
      {{> t10e goal.displayNameTranslation}}
    </div>
    <label class="archived">
      {{> PixelArtAcademy.PixelPad.Apps.StudyPlan.GoalInfo.Archived}}
      <span class="checkmark"></span> Archived
    </label>
    <p class="instructions">
      {{#if goal.allCompleted}}
        Fully completed goals are archived by default.
      {{else}}
        {{#if goal.completed}}
          {{#if manuallyArchived}}
            Remove the checkmark to show this goal's optional tasks in your to-do list again.
          {{else}}
            Mark the goal as archived to remove optional tasks from your to-do list.
          {{/if}}
        {{else}}
          Reach the flagpole to be able to archive this goal's optional tasks and tutorials.
        {{/if}}
      {{/if}}
    </p>
    {{#if canRemove}}
      <button class="action-button remove-button">Remove</button>
      <p class="instructions">
        {{#if goal.allCompleted}}
          Remove the goal from the study plan if you're not happy with its position.
        {{else}}
          Remove the goal from the study plan if you don't want to work on it anymore.
        {{/if}}
        You can always add it back later.
      </p>
    {{/if}}
  </div>
</template>
