<template name="PixelArtAcademy.PixelPad.Apps.StudyPlan.Progression">
  <div class="pixelartacademy-pixelpad-apps-studyplan-progression">
    <div class="panel-area">
      <div class="panel {{panelDisplayedClass}}">
        {{#if showIntro}}
          <div class="intro {{timelapsePlayedClass}}">
            {{#if timelapsePlaying}}
              <div class="timelapse">
                {{> LandsOfIllusions.Components.Video timelapseData}}
              </div>
            {{/if}}
            {{#if controlsReady}}
              <div class="controls">
                <button class="action-button replay-button">Replay</button>
                <button class="action-button start-button">Start</button>
              </div>
            {{/if}}
          </div>
        {{else}}
          <div class="level-progression">
            <div class="title">Study Plan progression</div>
            <ol class="levels">
              {{#each levelsInfo}}
                <li class="level {{levelUnlockingClass}} {{levelRevealedClass}}">
                  <div class="number">Level {{levelNumber}}</div>
                  {{#if levelRevealed}}
                    <div class="name">{{name}}</div>
                    <div class="description">{{description}}</div>
                    {{#if levelHasStartButton}}
                      <button class="action-button start-button">Start</button>
                    {{/if}}
                  {{else}}
                    {{#if levelHasUnlockButton}}
                      <button class="action-button unlock-button">Level up</button>
                    {{/if}}
                  {{/if}}
                </li>
              {{/each}}
            </ol>
          </div>
        {{/if}}
      </div>
    </div>
  </div>
</template>
