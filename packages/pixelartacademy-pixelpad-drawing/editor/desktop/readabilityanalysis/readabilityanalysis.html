<template name="PixelArtAcademy.PixelPad.Apps.Drawing.Editor.Desktop.ReadabilityAnalysis">
  <div class="pixelartacademy-pixelpad-apps-drawing-editor-desktop-readabilityanalysis table-item {{activeClass}} {{revealedClass}}">
    {{#if paperDisplayed}}
      <div class="paper">
        <div class="sheet"></div>
        <div class="content-placeholder" {{style contentPlaceholderStyle}}></div>
        <div class="content">
          <div class="header">
            <div class="pixeltosh {{pixeltoshClass}}"></div>
            <div class="title">Pixeltosh Readability Analysis</div>
          </div>
          <div class="analysis">
            {{#each regions}}
              <div class="region">
                <div class="image">
                  <span class="title">Image {{number}}</span>: {{label}}
                </div>
                {{#with this.recognition}}
                  <div class="recognition result {{resultPassesClass this}}">
                    <div class="summary">
                      <span class="title">Recognition</span>: {{summary}}
                    </div>
                    <div class="exlpanation">
                      {{explanation}}
                    </div>
                  </div>
                {{else}}
                  <div class="result">Draw the subject to see the analysis of its readability.</div>
                {{/with}}
                {{#if debug}}
                  <div class="classification">
                    {{#each classifierResults}}
                      <div class="classifier">
                        <div class="name">{{classifierName}} classifier</div>
                        <ol class="labels">
                          {{#each labelProbabilities}}
                            <li>{{label}}: {{probabilityPercentage}}%</li>
                          {{/each}}
                        </ol>
                      </div>
                    {{/each}}
                  </div>
                {{/if}}
              </div>
            {{else}}
              <div class="result">Decide which subjects you wish to draw to see the analysis of their readability.</div>
            {{/each}}
          </div>
        </div>
      </div>
    {{/if}}
  </div>
</template>
