<template name="PixelArtAcademy.PixelPad.Apps.Drawing.Clipboard">
  <div class="pixelartacademy-pixelpad-apps-drawing-clipboard {{activeClass}} {{editorActiveClass}}">
    <div class="board">
      <div class="navigation-indicators">
        {{#if drawing.canGoLeft}}
          <div class="left indicator">←</div>
        {{/if}}
        {{#if drawing.canGoRight}}
          <div class="right indicator">→</div>
        {{/if}}
      </div>
    </div>
    {{> Render asset.clipboardComponent}}
  </div>
</template>
